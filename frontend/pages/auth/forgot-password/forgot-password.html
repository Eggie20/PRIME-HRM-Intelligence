<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your NBSC PRIME-HRM account password.">
  <title>Reset Password — NBSC PRIME-HRM</title>
  <link rel="stylesheet" href="../../../shared/css/global.css">
  <link rel="stylesheet" href="../../../shared/css/components.css">
  <link rel="stylesheet" href="../../../shared/css/layout.css">
  <link rel="stylesheet" href="../../../shared/css/utilities.css">
  <link rel="stylesheet" href="forgot-password.css">
</head>
<body class="forgot-body">
  <main class="forgot-container">
    <div class="forgot-card">
      <header class="forgot-header text-center">
        <div class="forgot-icon">&#128273;</div>
        <h1 class="forgot-title">Forgot Password?</h1>
        <p class="forgot-subtitle">Enter your registered email address and we'll send you instructions to reset your password.</p>
      </header>

      <form id="form-forgot-password" novalidate>
        <div class="form-group">
          <label for="input-reset-email" class="form-group__label form-group__label--required">Email Address</label>
          <input
            type="email"
            id="input-reset-email"
            name="email"
            class="form-group__input"
            placeholder="e.g. yourname@nbsc.edu.ph"
            required
          >
          <span class="form-group__error" id="input-reset-email-error"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--lg w-100 mt-4" id="btn-submit-reset">
          <span id="btn-reset-text">Send Reset Link</span>
        </button>
      </form>

      <div id="reset-success-box" class="reset-success d-none">
        <p class="text-sm text-center text-success font-semibold">
          &#10004; If an account matches that email, a password reset link has been dispatched to your inbox.
        </p>
      </div>

      <footer class="forgot-footer text-center">
        <a href="../admin-login/admin-login.html" class="text-sm text-muted" id="link-back-signin">&larr; Return to login</a>
      </footer>
    </div>
  </main>

  <script src="../../../shared/js/constants.js"></script>
  <script src="../../../shared/js/utils.js"></script>
  <script src="../../../shared/js/components.js"></script>
  <script src="../../../shared/js/db.js"></script>
  <script src="../../../shared/js/api.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
