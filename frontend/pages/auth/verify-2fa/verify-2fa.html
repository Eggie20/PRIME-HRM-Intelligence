<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enter your 6-digit authenticator security code to access your NBSC PRIME-HRM workspace.">
  <title>Security Verification — NBSC PRIME-HRM</title>
  <link rel="stylesheet" href="../../../shared/css/global.css">
  <link rel="stylesheet" href="../../../shared/css/components.css">
  <link rel="stylesheet" href="../../../shared/css/layout.css">
  <link rel="stylesheet" href="../../../shared/css/utilities.css">
  <link rel="stylesheet" href="verify-2fa.css">
</head>
<body class="verify-2fa-body">
  <main class="verify-container">
    <div class="verify-card">
      <header class="verify-header text-center">
        <div class="verify-icon">&#128272;</div>
        <h1 class="verify-title">Two-Factor Authentication</h1>
        <p class="verify-subtitle">Enter the 6-digit security code generated by your mobile authenticator app.</p>
      </header>

      <form id="form-verify-2fa" novalidate>
        <div class="form-group text-center">
          <input
            type="text"
            id="input-totp-code"
            name="code"
            class="form-group__input verify-input"
            placeholder="000000"
            maxlength="6"
            pattern="\d{6}"
            autocomplete="one-time-code"
            required
            autofocus
          >
          <span class="form-group__error text-center" id="input-totp-code-error"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--lg w-100 mt-4" id="btn-submit-verify">
          <span id="btn-verify-text">Authenticate Session</span>
        </button>
      </form>

      <footer class="verify-footer text-center">
        <a href="../admin-login/admin-login.html" class="text-sm text-muted" id="link-back-login">&larr; Back to sign in</a>
      </footer>
    </div>
  </main>

  <script src="../../../shared/js/constants.js"></script>
  <script src="../../../shared/js/utils.js"></script>
  <script src="../../../shared/js/components.js"></script>
  <script src="../../../shared/js/db.js"></script>
  <script src="../../../shared/js/api.js"></script>
  <script src="../../../shared/js/auth.js"></script>
  <script src="verify-2fa.js"></script>
</body>
</html>
